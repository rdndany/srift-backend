name: CI
on:
  push:
    branches: [main]
  pull_request:
  # Lets you start the run by hand (GitHub > Actions > CI > Run workflow); that is the only time the e2e job runs.
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # (the unit tests are run on the developer's machine only, with `npm test`; they are not run on a push)
      - run: npm run build

  # Browser end-to-end tests: slow, so only on demand.
  e2e:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
